{% extends "base.html" %}

{% block title %}Student Registration | {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-lg-8">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                <div>
                    <h2 class="fw-bold text-white mb-1">Student Placement Registration</h2>
                    <p class="text-secondary small mb-0">Create your candidate profile to apply for campus recruitment drives</p>
                </div>
                <div class="brand-logo-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <!-- Account Credentials -->
                <h5 class="text-primary fw-semibold mb-3">1. Login Credentials</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-custom" for="username">Username *</label>
                        <input type="text" class="form-control-custom" id="username" name="username" placeholder="e.g. rahul.sharma" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom" for="email">College Email Address *</label>
                        <input type="email" class="form-control-custom" id="email" name="email" placeholder="rahul@college.edu" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom" for="password">Password (min 6 chars) *</label>
                        <input type="password" class="form-control-custom" id="password" name="password" minlength="6" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom" for="confirm_password">Confirm Password *</label>
                        <input type="password" class="form-control-custom" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Academic Profile -->
                <h5 class="text-primary fw-semibold mb-3">2. Academic Information</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label-custom" for="roll_number">Roll Number / USN *</label>
                        <input type="text" class="form-control-custom text-uppercase" id="roll_number" name="roll_number" placeholder="e.g. 21CS099" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-custom" for="first_name">First Name *</label>
                        <input type="text" class="form-control-custom" id="first_name" name="first_name" placeholder="Rahul" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-custom" for="last_name">Last Name *</label>
                        <input type="text" class="form-control-custom" id="last_name" name="last_name" placeholder="Sharma" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom" for="department_id">Department / Program *</label>
                        <select class="form-control-custom" id="department_id" name="department_id" required>
                            <option value="">-- Select Department --</option>
                            {% for dept in departments %}
                                <option value="{{ dept.department_id }}">{{ dept.department_name }} ({{ dept.department_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-custom" for="graduation_year">Graduation Year *</label>
                        <select class="form-control-custom" id="graduation_year" name="graduation_year" required>
                            <option value="2025">2025</option>
                            <option value="2026" selected>2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label-custom" for="cgpa">Current CGPA (0-10) *</label>
                        <input type="number" step="0.01" min="0" max="10" class="form-control-custom" id="cgpa" name="cgpa" placeholder="8.50" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-custom" for="backlogs">Active Backlogs *</label>
                        <input type="number" min="0" class="form-control-custom" id="backlogs" name="backlogs" value="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-custom" for="phone">Contact Phone</label>
                        <input type="tel" class="form-control-custom" id="phone" name="phone" placeholder="9876543210">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label-custom" for="resume_url">Resume Link (PDF URL)</label>
                        <input type="url" class="form-control-custom" id="resume_url" name="resume_url" placeholder="https://drive.google.com/...">
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between pt-3 border-top border-secondary border-opacity-25">
                    <a href="{{ url_for('auth.login') }}" class="btn-secondary-custom">
                        <i class="fa-solid fa-arrow-left"></i> Back to Login
                    </a>
                    <button type="submit" class="btn-primary-gradient px-4" id="register-submit-btn">
                        <i class="fa-solid fa-user-check"></i> Complete Registration
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
